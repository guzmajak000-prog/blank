<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google Docs</title>
<link rel="icon" href="https://ssl.gstatic.com/docs/documents/images/kix-favicon-2023q4.ico">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    color-scheme: dark;
    --bg: #0a0a0b;
    --surface: #0f0f11;
    --border: rgba(255,255,255,0.08);
    --text-1: #fafafa;
    --text-2: #b0b0b3;
    --text-3: #9a9a9d;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { margin: 0; height: 100%; }

  body {
    background: var(--bg);
    color: var(--text-1);
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    overflow: hidden;
  }

  /* ---------- Loader ---------- */

  #loader {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    transition: opacity 0.25s var(--ease);
  }

  #loader img {
    width: 260px;
    max-width: 70vw;
    height: auto;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }

  .wordmark {
    display: none;
    color: var(--text-1);
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.45em;
    text-indent: 0.45em;
  }

  .loadbar {
    width: 140px;
    height: 2px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }
  .loadbar::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 40%;
    background: rgba(255,255,255,0.5);
    border-radius: 2px;
    animation: sweep 1.3s ease-in-out infinite;
  }
  @keyframes sweep {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }

  /* ---------- Error ---------- */

  #error {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    transition: opacity 0.25s var(--ease);
  }

  .error-card {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px;
    text-align: center;
    box-sizing: border-box;
  }

  .error-card img {
    width: 190px;
    max-width: 60%;
    height: auto;
    margin: 0 auto 20px;
    display: block;
    opacity: 0.92;
    user-select: none;
    -webkit-user-drag: none;
  }

  .error-card .wordmark {
    display: inline-block;
    margin-bottom: 20px;
    font-size: 15px;
  }

  .error-card h1 {
    color: var(--text-1);
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
  }

  .error-card p {
    color: var(--text-3);
    font-size: 13px;
    line-height: 1.6;
    margin: 0 0 20px;
  }

  #retry {
    background: #fafafa;
    color: #0a0a0b;
    border: 0;
    border-radius: 8px;
    padding: 10px 24px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 0.15s var(--ease);
  }
  #retry:hover { background: #e4e4e7; }
  #retry:focus-visible {
    outline: 2px solid rgba(255,255,255,0.4);
    outline-offset: 2px;
  }

  /* ---------- Frame ---------- */

  #frame {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: none;
    background: #000;
  }
</style>
</head>
<body>

  <div id="loader">
    <img id="loaderLogo" alt="" draggable="false"
         src="https://mantleunblocked.github.io/assets/full%20logo.png"
         onerror="this.style.display='none';document.getElementById('loaderWordmark').style.display='block';">
    <span class="wordmark" id="loaderWordmark">MANTLE</span>
    <div class="loadbar"></div>
  </div>

  <div id="error">
    <div class="error-card">
      <img id="errorLogo" alt="" draggable="false"
           src="https://mantleunblocked.github.io/assets/full%20logo.png"
           onerror="this.style.display='none';document.getElementById('errWordmark').style.display='block';">
      <span class="wordmark" id="errWordmark">MANTLE</span>
      <h1>Mantle couldn't load</h1>
      <p id="reason"></p>
      <button id="retry">Retry</button>
    </div>
  </div>

  <iframe id="frame" referrerpolicy="no-referrer"
          allow="fullscreen; pointer-lock; gamepad; autoplay; clipboard-read; clipboard-write; camera; microphone"></iframe>

<script>
"use strict";

/* =======================================================================
   MANTLE LAUNCHER. Fire and forget shell: all design and functionality
   lives in the hub pulled from GitHub. This file only needs updating
   if you change mirror hosts or the logo URL.

   Source URLs are stored as fragment arrays and joined at boot, so the
   raw strings don't sit in plain text in the file or in any console
   output. This is obscurity, not security: the requests still appear in
   the Network tab, and network-level blockers work by domain, not by
   reading source. The real protections are (a) trying multiple CDN
   hosts so a single block doesn't kill us, (b) caching the hub offline
   so a first success keeps working, and (c) keeping app domains out of
   the shell entirely, since they live in the hub.
   ======================================================================= */

const FRAGMENTS = {
  // Each entry is an array of pieces joined at boot to build a URL.
  sources: [
    ["https://", "raw", ".", "git", "hub", "user", "content", ".com/", "dobberr/mantle-menu/main/index.html"],
    ["https://", "cdn", ".", "jsdelivr", ".net", "/gh/", "dobberr/mantle-menu@main/index.html"],
    ["https://", "raw", ".", "githack", ".com/", "dobberr/mantle-menu/main/index.html"],
    ["https://", "cdn", ".", "statically", ".io/gh/", "dobberr/mantle-menu/main/index.html"]
  ],
  // <base> for any relative assets the hub may gain later.
  base: ["https://", "cdn", ".", "jsdelivr", ".net", "/gh/", "dobberr/mantle-menu@main/"],
  cacheKey: "mantle.hub.cache.v1",
  spoof: [
    { title: "Google Docs",      icon: "https://ssl.gstatic.com/docs/documents/images/kix-favicon-2023q4.ico" },
    { title: "Google Classroom", icon: "https://www.gstatic.com/classroom/favicon.png" },
    { title: "Google Drive",     icon: "https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png" }
  ]
};

const SOURCES   = FRAGMENTS.sources.map(parts => parts.join(""));
const BASE_HREF = FRAGMENTS.base.join("");
const CACHE_KEY = FRAGMENTS.cacheKey;

/* ---- stealth: spoof THIS tab. The hub runs in an iframe, so its own
   title and favicon code can't reach the tab. The shell handles it. ---- */
(function () {
  const s = FRAGMENTS.spoof[Math.floor(Math.random() * FRAGMENTS.spoof.length)];
  const apply = () => {
    if (document.title !== s.title) document.title = s.title;
    let l = document.querySelector("link[rel~='icon']");
    if (!l) { l = document.createElement("link"); l.rel = "icon"; document.head.appendChild(l); }
    if (l.href !== s.icon) l.href = s.icon;
  };
  apply();
  setInterval(apply, 1000);
})();

/* ---- fetch the hub: mirrors in order, then last cached copy ---- */
let hubPromise = null;
function getHub() {
  if (!hubPromise) {
    hubPromise = (async () => {
      let lastErr;
      for (const url of SOURCES) {
        try {
          const res = await fetch(url, { cache: "no-cache" });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const html = await res.text();
          // Reject school block pages and captive portals that return 200.
          if (html.length < 200 || !/<html/i.test(html) || !/mantle/i.test(html))
            throw new Error("Response wasn't the hub");
          try { localStorage.setItem(CACHE_KEY, html); } catch (_) {}
          return html;
        } catch (e) { lastErr = e; }
      }
      const cached = (() => { try { return localStorage.getItem(CACHE_KEY); } catch (_) { return null; } })();
      if (cached) return cached;
      throw lastErr || new Error("All sources failed");
    })().catch(e => { hubPromise = null; throw e; });
  }
  return hubPromise;
}

/* ---- write the hub into the iframe ---- */
function install(html, doc) {
  if (BASE_HREF && !/<base\s/i.test(html)) {
    html = /<head[^>]*>/i.test(html)
      ? html.replace(/<head[^>]*>/i, m => m + '<base href="' + BASE_HREF + '">')
      : '<base href="' + BASE_HREF + '">' + html;
  }
  doc.open();
  doc.write(html);
  doc.close();
}

/* ---- boot ---- */
const frame  = document.getElementById("frame");
const loader = document.getElementById("loader");
const errBox = document.getElementById("error");
let busy = false;

async function boot() {
  if (busy || frame.style.display === "block") return;
  busy = true;
  errBox.style.display = "none";
  loader.style.display = "flex";
  loader.style.opacity = "1";
  try {
    const html = await getHub();
    install(html, frame.contentDocument);
    frame.style.display = "block";
    loader.style.opacity = "0";
    setTimeout(() => { if (loader.parentNode) loader.remove(); }, 300);
  } catch (e) {
    loader.style.display = "none";
    document.getElementById("reason").textContent =
      "It will keep retrying automatically. If this is the first run on a " +
      "school network, open the file once on a home network first. It saves " +
      "an offline copy for exactly this situation.";
    errBox.style.display = "flex";
    setTimeout(boot, 12000);
  } finally {
    busy = false;
  }
}

document.getElementById("retry").addEventListener("click", boot);
boot();
</script>
</body>
</html>
